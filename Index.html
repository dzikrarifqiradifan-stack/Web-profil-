<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Profil - Dzikra Rifqi Radifan</title>
    <style>
        /* --- RESET & BASIC STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- CARD CONTAINER --- */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Accent Top Line */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #3b82f6, #10b981);
        }

        /* --- PROFILE AVATAR --- */
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 40px;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        /* --- HEADER --- */
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* --- INFO LIST --- */
        .info-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
            margin-bottom: 30px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 18px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, background 0.2s;
        }

        .info-item:hover {
            transform: translateX(5px);
            background: rgba(255, 255, 255, 0.08);
        }

        .label {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
        }

        .value {
            font-size: 14px;
            color: #f1f5f9;
            font-weight: 600;
        }

        /* --- INTERACTIVE BUTTON --- */
        .btn {
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        /* --- POPUP MESSAGE --- */
        .message {
            margin-top: 15px;
            font-size: 13px;
            color: #10b981;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .message.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Avatar Inisial Nama -->
        <div class="avatar" id="avatar">DR</div>

        <!-- Header -->
        <h1 id="nama">Dzikra Rifqi Radifan</h1>
        <p class="subtitle">Calon Atlet Masa Depan</p>

        <!-- Informasi Profil -->
        <div class="info-container">
            <div class="info-item">
                <span class="label">Umur</span>
                <span class="value">16 Tahun</span>
            </div>
            <div class="info-item">
                <span class="label">Tempat, Tgl Lahir</span>
                <span class="value">Bandung, 15 Oktober 2010</span>
            </div>
            <div class="info-item">
                <span class="label">Hobi</span>
                <span class="value">Olahraga ⚽🏀</span>
            </div>
            <div class="info-item">
                <span class="label">Cita-cita</span>
                <span class="value">Atlet 🏆</span>
            </div>
            <div class="info-item">
                <span class="label">Alamat</span>
                <span class="value">Kp. Lebak Siuh No. 123</span>
            </div>
        </div>

        <!-- Tombol Interaktif -->
        <button class="btn" onclick="sapaPengunjung()">Kirim Semangat!</button>
        <div class="message" id="pesan"></div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        function sapaPengunjung() {
            const pesanElement = document.getElementById("pesan");
            pesanElement.innerText = "🔥 Terima kasih! Terus berjuang untuk meraih cita-cita menjadi atlet hebat!";
            pesanElement.classList.add("show");

            // Efek interaktif tombol
            setTimeout(() => {
                pesanElement.classList.remove("show");
            }, 4000);
        }

        // Fitur log di browser console
        console.log("Website Profil Dzikra Rifqi Radifan siap ditampilkan.");
    </script>

</body>
</html>
