<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Dzikra Rifqi Radifan</title>
    <style>
        /* RESET & BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
        }

        /* CONTAINER & CARD */
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .profile-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        /* HEADER SECTION */
        .profile-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
        }

        .avatar-placeholder {
            width: 120px;
            height: 120px;
            background-color: #ffffff;
            color: #1e3c72;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            margin: 0 auto 15px;
            border: 4px solid rgba(255, 255, 255, 0.3);
        }

        .profile-header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .profile-header p {
            font-size: 16px;
            opacity: 0.9;
        }

        /* BODY SECTION */
        .profile-body {
            padding: 30px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-item {
            background: #f8fafc;
            padding: 15px 20px;
            border-radius: 10px;
            border-left: 4px solid #2a5298;
        }

        .info-item h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-item p {
            font-size: 18px;
            font-weight: 600;
            color: #1e3c72;
        }

        /* INTERACTIVE BUTTON & MOTIVATION SECTION */
        .action-section {
            text-align: center;
            border-top: 1px solid #eeeeee;
            padding-top: 20px;
        }

        .btn-quote {
            background-color: #2a5298;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .btn-quote:hover {
            background-color: #1e3c72;
            transform: translateY(-2px);
        }

        .btn-quote:active {
            transform: translateY(0);
        }

        .quote-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef2f5;
            border-radius: 8px;
            font-style: italic;
            color: #444;
            display: none; /* Disembunyikan awalnya, muncul via JavaScript */
        }

        /* FOOTER */
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <!-- Header Profil -->
            <div class="profile-header">
                <div class="avatar-placeholder">D</div>
                <h1>Dzikra Rifqi Radifan</h1>
                <p>Calon Atlet Masa Depan 🏆</p>
            </div>

            <!-- Detail Informasi Profil -->
            <div class="profile-body">
                <div class="info-grid">
                    <div class="info-item">
                        <h3>Umur</h3>
                        <p>16 Tahun</p>
                    </div>
                    <div class="info-item">
                        <h3>Tempat, Tanggal Lahir</h3>
                        <p>Bandung, 15 Oktober 2010</p>
                    </div>
                    <div class="info-item">
                        <h3>Hobi</h3>
                        <p>Olahraga ⚽🏀🏃</p>
                    </div>
                    <div class="info-item">
                        <h3>Cita-cita</h3>
                        <p>Atlet Profesional 🥇</p>
                    </div>
                </div>

                <!-- Bagian Interaktif (JavaScript) -->
                <div class="action-section">
                    <button class="btn-quote" onclick="tampilkanMotivasi()">Ambil Motivasi Hari Ini</button>
                    <div class="quote-box" id="quoteDisplay"></div>
                </div>
            </div>
        </div>

        <div class="footer">
            &copy; Profil Web Dzikra Rifqi Radifan
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const motivasiList = [
            '"Kerja keras mengalahkan bakat ketika bakat tidak bekerja keras."',
            '"Kesuksesan berawal dari keputusan untuk mencoba dan konsistensi untuk latihan."',
            '"Setiap tetes keringat hari ini adalah langkah menuju medali esok hari."',
            '"Jangan menyerah saat lelah, menyerahlah saat kamu sudah selesai."',
            '"Seorang atlet sejati fokus pada proses dan pantang menyerah."'
        ];

        function tampilkanMotivasi() {
            const quoteBox = document.getElementById('quoteDisplay');
            
            // Mengambil motivasi acak dari list
            const randomIndex = Math.floor(Math.random() * motivasiList.length);
            const quotePilihan = motivasiList[randomIndex];

            // Menampilkan motivasi di layar
            quoteBox.innerText = quotePilihan;
            quoteBox.style.display = 'block';
        }
    </script>
</body>
                          </html>
